name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - name: Install
        run: |
          uv venv --python 3.12
          uv pip install -e ".[dev]"
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Type check
        run: uv run mypy
      - name: Test (core; harbor-dependent tests skip)
        run: uv run pytest tests/ -q
      - name: Examples run offline
        run: |
          uv run python examples/quickstart.py
          uv run python examples/stream_quickstart.py
      - name: CLI smoke (offline)
        run: |
          uv run reef-eval list
          uv run reef-eval run autoresearch/first-party --agent oracle --fake --lab runs/ci-smoke
          uv run reef-eval stream autoresearch/first-party --name ci-week --agent oracle --fake --lab runs/ci-smoke
          uv run reef-eval report --lab runs/ci-smoke
      - name: Local mode (real scoring, no Docker)
        run: |
          uv run reef-eval run autoresearch/first-party/circle-packing --local \
            --command "python examples/random_search.py" \
            --budget 0.002 --lab runs/ci-local
          uv run reef-eval report --lab runs/ci-local
